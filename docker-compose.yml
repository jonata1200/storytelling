services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storytelling-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storytelling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storytelling}
      POSTGRES_DB: ${POSTGRES_DB:-storytelling}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storytelling -d storytelling"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storytelling-redis
    ports:
      - "${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: storytelling-worker
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storytelling}:${POSTGRES_PASSWORD:-storytelling}@postgres:5432/${POSTGRES_DB:-storytelling}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-development}
      META_API_KEY: ${META_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-}
      META_IMAGE_ENDPOINT: ${META_IMAGE_ENDPOINT:-}
      VIBES_BROWSER_AUTOMATION_ENABLED: ${VIBES_BROWSER_AUTOMATION_ENABLED:-false}
    volumes:
      - ./storage:/app/storage
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
