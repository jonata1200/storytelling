services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storytelling-postgres
    environment:
      POSTGRES_USER: storytelling
      POSTGRES_PASSWORD: storytelling
      POSTGRES_DB: storytelling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storytelling -d storytelling"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storytelling-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
