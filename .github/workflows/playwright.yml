name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: storytelling
          POSTGRES_USER: storytelling
          POSTGRES_PASSWORD: storytelling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storytelling -d storytelling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_SECRET_KEY: playwright-ci-secret
      DATABASE_URL: postgresql+asyncpg://storytelling:storytelling@127.0.0.1:5432/storytelling
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install application
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock -r requirements.dev.lock
        pip install -e . --no-deps
    - name: Apply database migrations
      run: alembic upgrade head
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start application
      run: |
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
        for attempt in {1..30}; do
          curl --fail --silent http://127.0.0.1:8000/api/v1/health/live && exit 0
          sleep 1
        done
        cat uvicorn.log
        exit 1
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
