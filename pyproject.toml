[project]
name = "storytelling-studio"
version = "0.1.0"
description = "Structured AI-assisted vertical video storytelling production system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.3",
    "nicegui>=1.4.29",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.7",
    "sqlalchemy>=2.0.31",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.1",
    "playwright>=1.45.0",
    "pre-commit>=3.7.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast deterministic tests for isolated functions and value objects",
    "integration: tests that cross service, workflow, persistence, or async boundaries",
    "provider: provider contract tests for LLM, image, speech, video, or provider fallback behavior",
    "ui: NiceGUI page, workspace, routing facade, or UI helper tests",
    "security: authentication, authorization, path traversal, model policy, upload validation, or safety regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
